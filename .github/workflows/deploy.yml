name: Deploy RUSH to GitHub Pages

on:
  push:
    branches: [claude/rush-mobile-games-7to8P, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Génère les icônes PNG depuis le SVG avec ImageMagick
      - name: Generate PWA icons
        run: |
          mkdir -p public/icons

          # icon-512.png — plein format
          convert -background '#0A0A0F' \
            -fill '#00D4FF' -font DejaVu-Sans-Bold -pointsize 280 \
            -size 512x512 -gravity Center label:'R' \
            -bordercolor '#0A0A0F' -border 0 \
            public/icons/icon-512.png

          # icon-192.png
          convert -resize 192x192 public/icons/icon-512.png \
            public/icons/icon-192.png

          # icon-maskable-512.png — avec padding 20% pour la zone sûre
          convert -background '#0A0A0F' \
            -fill '#00D4FF' -font DejaVu-Sans-Bold -pointsize 210 \
            -size 512x512 -gravity Center label:'R' \
            public/icons/icon-maskable-512.png

          echo "Icons generated:"
          ls -lh public/icons/

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Shift-Grid/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
